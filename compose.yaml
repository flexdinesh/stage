services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: t3stage
      POSTGRES_PASSWORD: t3stage
      POSTGRES_DB: t3stage
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t3stage -d t3stage"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://t3stage:t3stage@127.0.0.1:5439/t3stage?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
