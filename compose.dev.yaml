# Dev and test Postgres. Its own project, port (5440) and volume, so `make
# dev`, `make test` and `docker compose -f compose.dev.yaml down -v` never
# touch the production database (compose.yaml, 5439).
name: stage-dev

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: stage
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
