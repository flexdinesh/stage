# Dev uses a per-branch SQLite file under .scratch/dev; tests use temp files.
# Only `up`/`down` touch the prod stack (compose.yaml).

[tools]
go = "1.27.3"   # server/go.mod
node = "26"     # Dockerfile
pnpm = "12.15.0" # Dockerfile

[tasks.dev]
description = "Branch db + Go server (:7390, real T3) + browser host on Vite (proxies /api)"
raw = true
run = '''
#!/usr/bin/env bash
set -e
# One dev database per branch, so worktrees don't share state:
# .scratch/dev/<branch>/stage.db.
DEV_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
DEV_DIR="$PWD/.scratch/dev/$(printf '%s' "$DEV_BRANCH" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-80)"
# Load .env.dev (if present, never .env). STAGE_DATA_DIR is always the branch's dev dir.
set -a; [ -f .env.dev ] && . ./.env.dev; set +a
export STAGE_ENV=dev STAGE_DATA_DIR="$DEV_DIR" STAGE_LISTEN="${STAGE_LISTEN:-127.0.0.1:7390}"
echo "dev db $DEV_DIR/stage.db, server $STAGE_LISTEN"
# On exit, kill only this script's jobs and their descendants (go run's binary,
# vite), never the process group (mise, the calling shell).
kill_tree() { local c; for c in $(pgrep -P "$1"); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
trap 'for p in $(jobs -p); do kill_tree "$p"; done' EXIT
(cd server && go run ./cmd/stage) &
(pnpm install && cd web && pnpm dev) &
wait
'''

[tasks.build]
description = "Browser host bundle (web/dist) embedded into a single Go binary at bin/stage"
run = [
  "pnpm install --frozen-lockfile && pnpm --filter stage-web build",
  "find server/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete",
  "cp -r web/dist/. server/internal/webui/dist/",
  # Version/commit for /api/health and `stage status` (docs/runtime.md).
  '''cd server && CGO_ENABLED=0 go build -ldflags "-X github.com/flexdinesh/stage/server/internal/buildinfo.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) -X github.com/flexdinesh/stage/server/internal/buildinfo.Commit=$(git rev-parse HEAD 2>/dev/null)" -o ../bin/stage ./cmd/stage''',
]

[tasks.install-cli]
description = "Agent CLI / stdio MCP binary (no web bundle) at ~/.local/bin/stage"
run = [
  'mkdir -p "$HOME/.local/bin"',
  'cd server && CGO_ENABLED=0 go build -o "$HOME/.local/bin/stage" ./cmd/stage',
]

[tasks.test]
description = "Go tests + app/web tests, typecheck, lint"
run = [
  "cd server && go vet ./... && go test ./...",
  "pnpm -r test && pnpm -r typecheck && pnpm -r lint",
]

[tasks.check]
description = "Everything CI-like: go vet + go test, app/web install + test/typecheck/lint, desktop fixture Go tests"
depends = ["check:go", "check:web", "check:fixture"]

[tasks."check:go"]
description = "go vet (with and without the smoke tag) + go test"
run = "cd server && go vet ./... && go vet -tags smoke ./... && go test ./..."

[tasks."service:smoke"]
description = "Real user-service smoke check (Linux systemd --user) with the isolated stage-svctest identity; never the installed service"
run = "cd server && STAGE_SERVICE_SMOKE=1 go test -tags smoke -count=1 -v -timeout 10m -run '^TestSmoke$' ./internal/service"

[tasks."check:web"]
description = "Workspace install (frozen lockfile) + app and web host test/typecheck/lint"
run = "pnpm install --frozen-lockfile && pnpm -r test && pnpm -r typecheck && pnpm -r lint"

[tasks."check:fixture"]
description = "Desktop fixture (desktop/fixture): go vet (with and without e2e tag) + go test; no webview needed"
run = "cd desktop/fixture && go vet ./... && go vet -tags e2e ./... && go test ./..."

[tasks."fixture:e2e"]
description = "Desktop fixture webview e2e: needs a display + WebKitGTK 4.1, or macOS. STAGE_FIXTURE_REAL_UI=1 adds the real Stage UI"
raw = true
run = '''
#!/usr/bin/env bash
set -e
cd desktop/fixture
find dist -mindepth 1 ! -name .gitkeep -delete
(cd web && pnpm install --frozen-lockfile && pnpm test && pnpm lint && pnpm build)
if [ "${STAGE_FIXTURE_REAL_UI:-}" = 1 ]; then
  (cd ../../web && pnpm install --frozen-lockfile && pnpm build)
fi
go test -tags e2e -count=1 -v ./e2e
'''

[tasks.up]
description = "Build and run the production stack in compose"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop the production stack (data volume kept)"
run = "docker compose down"
