# Dev uses a per-branch SQLite file under .scratch/dev; tests use temp files.
# Only `up`/`down` touch the prod stack (compose.yaml).

[tools]
go = "1.27.3"   # server/go.mod
node = "26.13.0" # Dockerfile (node:26)
pnpm = "12.15.0" # Dockerfile
shellcheck = "0.11.0" # scripts/release.sh (check:release)

[tasks.dev]
description = "Branch db + Go server (:7390, real T3) + browser host on Vite (proxies /api)"
raw = true
run = '''
#!/usr/bin/env bash
set -e
# One dev database per branch, so worktrees don't share state:
# .scratch/dev/<branch>/stage.db.
DEV_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
DEV_DIR="$PWD/.scratch/dev/$(printf '%s' "$DEV_BRANCH" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-80)"
# Load .env.dev (if present, never .env). STAGE_DATA_DIR is always the branch's dev dir.
set -a; [ -f .env.dev ] && . ./.env.dev; set +a
export STAGE_ENV=dev STAGE_DATA_DIR="$DEV_DIR" STAGE_LISTEN="${STAGE_LISTEN:-127.0.0.1:7390}"
echo "dev db $DEV_DIR/stage.db, server $STAGE_LISTEN"
# On exit, kill only this script's jobs and their descendants (go run's binary,
# vite), never the process group (mise, the calling shell).
kill_tree() { local c; for c in $(pgrep -P "$1"); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
trap 'for p in $(jobs -p); do kill_tree "$p"; done' EXIT
(cd server && go run ./cmd/stage) &
(pnpm install && cd apps/web && pnpm dev) &
wait
'''

[tasks.build]
description = "Browser host bundle (apps/web/dist) embedded into a single Go binary at bin/stage"
run = [
  "pnpm install --frozen-lockfile --filter '@stage/web...' && pnpm --filter @stage/web build",
  "find server/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete",
  "cp -r apps/web/dist/. server/internal/webui/dist/",
  # Version/commit for /api/health and `stage status` (docs/runtime.md).
  '''cd server && CGO_ENABLED=0 go build -ldflags "-X github.com/flexdinesh/stage/server/internal/buildinfo.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) -X github.com/flexdinesh/stage/server/internal/buildinfo.Commit=$(git rev-parse HEAD 2>/dev/null)" -o ../bin/stage ./cmd/stage''',
]

[tasks.install-cli]
description = "Agent CLI / stdio MCP binary (no web bundle) at ~/.local/bin/stage"
run = [
  'mkdir -p "$HOME/.local/bin"',
  'cd server && CGO_ENABLED=0 go build -o "$HOME/.local/bin/stage" ./cmd/stage',
]

[tasks.test]
description = "Go tests + packages/app, apps/web and desktop UI tests, typecheck, lint (website: check:website)"
run = [
  "cd server && go vet ./... && go test ./...",
  "pnpm -r --filter '!@stage/website' test && pnpm -r --filter '!@stage/website' typecheck && pnpm -r --filter '!@stage/website' lint",
]

[tasks.check]
description = "Everything CI-like: go vet + go test, workspace install + test/typecheck/lint, website checks, desktop fixture and desktop app Go tests, release tool"
depends = ["check:go", "check:web", "website:check", "check:fixture", "check:desktop", "check:release"]

[tasks."check:go"]
description = "go vet (with and without the smoke tag) + go test"
run = "cd server && go vet ./... && go vet -tags smoke ./... && go test ./..."

[tasks."opencode:live"]
description = "Verify the adapter and mixed tree against an isolated OpenCode V2 server and local test model"
run = '''
: "${STAGE_TEST_OPENCODE:?Set STAGE_TEST_OPENCODE to the absolute path of the tested OpenCode executable}"
cd server && go test -race -count=1 -v -timeout 3m ./internal/opencode
'''

[tasks."opencode:workflow"]
description = "Run the public CLI, HTTP and MCP workflow against an isolated OpenCode V2 service"
depends = ["build"]
run = "python3 scripts/opencode-workflow.py"

[tasks."service:smoke"]
description = "Real user-service smoke check (Linux systemd --user) with the isolated stage-svctest identity; never the installed service"
run = "cd server && STAGE_SERVICE_SMOKE=1 go test -tags smoke -count=1 -v -timeout 10m -run '^TestSmoke$' ./internal/service"

[tasks."check:web"]
description = "Workspace install (frozen lockfile, product packages) + app, web host and desktop UI test/typecheck/lint"
run = "pnpm install --frozen-lockfile --filter '!@stage/website' && pnpm -r --filter '!@stage/website' test && pnpm -r --filter '!@stage/website' typecheck && pnpm -r --filter '!@stage/website' lint"

# Website (apps/website, @stage/website): static marketing and public docs on
# vocs. Independent of product builds and of a running Stage server.
[tasks."website:dev"]
description = "Website vocs dev server (:5175)"
run = "pnpm install --filter '@stage/website...' && pnpm --filter @stage/website dev"

[tasks."website:build"]
description = "Website static build to apps/website/dist/public"
run = "pnpm install --frozen-lockfile --filter '@stage/website...' && pnpm --filter @stage/website build"

[tasks."website:check"]
description = "Website: frontmatter (Ask AI off), typecheck, lint, vocs build (dead links), static output for every route"
alias = "check:website"
# Under `mise run check`, install after check:web's install, never concurrently.
wait_for = ["check:web"]
run = "pnpm install --frozen-lockfile --filter '@stage/website...' && pnpm --filter @stage/website check"

[tasks."readme:cover"]
description = "Record the README cover (docs/assets/readme-cover-*.webp/png) at 60 fps from apps/website's ReadmeCover scene; needs ffmpeg with libwebp_anim. `-- --keep` keeps the frames"
run = "pnpm install --frozen-lockfile --filter '@stage/website...' && pnpm --filter @stage/website exec playwright install chromium && node apps/website/scripts/record-readme-cover.ts"

[tasks."website:preview"]
description = "Website static build served the way Cloudflare Workers does (wrangler dev, :8787)"
run = "pnpm install --frozen-lockfile --filter '@stage/website...' && pnpm --filter @stage/website build && pnpm --filter @stage/website preview"

[tasks."check:fixture"]
description = "Desktop fixture (desktop/fixture): go vet (with and without e2e tag) + go test; no webview needed"
run = "cd desktop/fixture && go vet ./... && go vet -tags e2e ./... && go test ./..."

[tasks."check:desktop"]
description = "Desktop app (desktop/app): go vet (with and without e2e tag) + go test, incl. the headless integration test against a real stage serve; no webview needed"
run = "cd desktop/app && mkdir -p dist && touch dist/.gitkeep && go vet ./... && go vet -tags e2e ./... && go test ./..."

[tasks."desktop:dev"]
description = "Desktop app in development: foreground stage-dev server on a scratch socket (branch data dir) + go tool mygo dev with the UI's Vite server (:5174); no OS service touched"
raw = true
run = '''
#!/usr/bin/env bash
set -e
DEV_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
DEV_DIR="$PWD/.scratch/dev/$(printf '%s' "$DEV_BRANCH" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-80)"
BRANCH8=$(printf '%s' "$DEV_BRANCH" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-8)
SOCK_DIR="${XDG_RUNTIME_DIR:-/tmp}/stage-desktopdev"
mkdir -p "$SOCK_DIR" "$DEV_DIR/bin" && chmod 700 "$SOCK_DIR"
# The desktop app (dev builds only) and the UI's Vite proxy use this socket.
export STAGE_DESKTOP_SOCKET="$SOCK_DIR/$BRANCH8.sock"
export STAGE_DESKTOP_DEV_SOCKET="$STAGE_DESKTOP_SOCKET"
# Load .env.dev (if present, never .env); T3_FAKE and friends pass through.
set -a; [ -f .env.dev ] && . ./.env.dev; set +a
export STAGE_ENV=dev STAGE_DATA_DIR="$DEV_DIR/desktop"
unset STAGE_LISTEN STAGE_URL
(cd server && go build -ldflags "-X github.com/flexdinesh/stage/server/internal/buildinfo.Identity=stage-dev" -o "$DEV_DIR/bin/stage" ./cmd/stage)
echo "desktop dev: data $STAGE_DATA_DIR, socket $STAGE_DESKTOP_SOCKET"
# On exit, kill only this script's jobs and their descendants, never the
# process group (mise, the calling shell).
kill_tree() { local c; for c in $(pgrep -P "$1"); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
trap 'for p in $(jobs -p); do kill_tree "$p"; done' EXIT
"$DEV_DIR/bin/stage" serve --listen "unix:$STAGE_DESKTOP_SOCKET" &
pnpm install
# mygo.config.ts: devUrl http://localhost:5174, devCommand runs the UI's Vite server.
(cd desktop/app && go tool mygo dev) &
wait
'''

# Release assets (docs/release.md): scripts/release.sh builds, assembles
# (tools/release) and verifies. Nothing uploads, tags or installs.
[tasks.dist]
description = "Developer build of the working tree (stage-dev, 0.0.0-dev.<branch>): CLI/server + desktop for this machine (TARGETS=all: every target), manifest, checksums, verify; out STAGE_DIST_OUT (.scratch/dist/<version>)"
run = "scripts/release.sh dist"

[tasks.release]
description = "Release build of clean HEAD (VERSION=X.Y.Z, identity stage) from a git archive export: every target, manifest, checksums, verify; out STAGE_RELEASE_OUT (.scratch/release/v<version>)"
run = "scripts/release.sh release"

[tasks."release:verify"]
description = "Verify an asset directory (DIR=...): manifest, checksums, names, versions, bundled CLI, no secrets, smoke on this machine"
run = 'scripts/release.sh verify "${DIR:?set DIR to an asset directory}"'

[tasks."check:release"]
description = "Release tool (tools/release) go vet + go test (incl. scripts/install.sh against fixture releases, scripts/install-dev.sh and uninstall-dev.sh against a fixture origin), shellcheck of scripts/*.sh"
run = "cd tools/release && go vet ./... && go test ./... && cd ../.. && shellcheck scripts/release.sh && shellcheck -s sh scripts/install.sh scripts/install-dev.sh scripts/uninstall-dev.sh"

[tasks."install:smoke"]
description = "Installer smoke check: real binaries + systemd --user with the isolated stage-svctest identity (install, stage update, rollback, uninstall), then a real dist build installed into a temp home with no service manager"
raw = true
run = '''
#!/usr/bin/env bash
set -e
OUT="$PWD/.scratch/installtest/dist"
rm -rf "$OUT" && mkdir -p "$OUT"
STAGE_DIST_OUT="$OUT" mise run dist
cd server
STAGE_INSTALL_SMOKE=1 STAGE_INSTALL_SMOKE_DIST="$OUT" go test -tags smoke -count=1 -v -timeout 15m -run '^TestInstallSmoke' ./internal/install
'''

[tasks."desktop:e2e"]
description = "Desktop app webview e2e: needs a display + WebKitGTK 4.1, or macOS; builds the UI first, uses a temp foreground server (no OS service)"
raw = true
run = '''
#!/usr/bin/env bash
set -e
pnpm install --frozen-lockfile --filter '@stage/desktop...'
pnpm --filter @stage/desktop build
cd desktop/app
go test -tags e2e -count=1 -v -timeout 10m ./e2e
'''

[tasks."fixture:e2e"]
description = "Desktop fixture webview e2e: needs a display + WebKitGTK 4.1, or macOS. STAGE_FIXTURE_REAL_UI=1 adds the real Stage UI"
raw = true
run = '''
#!/usr/bin/env bash
set -e
cd desktop/fixture
find dist -mindepth 1 ! -name .gitkeep -delete
(cd web && pnpm install --frozen-lockfile && pnpm test && pnpm lint && pnpm build)
if [ "${STAGE_FIXTURE_REAL_UI:-}" = 1 ]; then
  (cd ../../apps/web && pnpm install --frozen-lockfile --filter '@stage/web...' && pnpm build)
fi
go test -tags e2e -count=1 -v ./e2e
'''

[tasks.up]
description = "Build and run the production stack in compose"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop the production stack (data volume kept)"
run = "docker compose down"
